# Prometheus alert rules for the stack itself plus RED-style alerts on the
# span metrics Tempo derives from traces. Evaluated by Prometheus, delivered
# by Alertmanager (config/alertmanager.yaml → ALERT_WEBHOOK_URL/HEARTBEAT_URL),
# and visible in Grafana under Alerting → Alert rules.
# Validated by `just check` (promtool check config, which loads these rules).

groups:
  - name: meta
    rules:
      # Always firing on purpose: its arrival at the heartbeat receiver is
      # the proof the whole alerting pipeline works. Silence = broken.
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "Alerting-pipeline heartbeat (always firing)"
          description: "Route this to a dead man's switch; investigate if pings stop."

  - name: stack-health
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Scrape target {{ $labels.job }} is down"
          description: "Prometheus cannot scrape {{ $labels.instance }} (job {{ $labels.job }}) for 2 minutes."

      - alert: OtelExportFailures
        expr: sum by (exporter) (rate(otelcol_exporter_send_failed_spans[5m])) > 0
          or sum by (exporter) (rate(otelcol_exporter_send_failed_metric_points[5m])) > 0
          or sum by (exporter) (rate(otelcol_exporter_send_failed_log_records[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "OTel Collector failing to export via {{ $labels.exporter }}"
          description: "The collector has been failing to deliver telemetry to a backend for 5 minutes. Check `just logs otel-collector`."

  - name: capacity
    rules:
      - alert: HostDiskSpaceLow
        expr: >
          (node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay"}
          / node_filesystem_size_bytes{fstype!~"tmpfs|ramfs|overlay"}) < 0.2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Filesystem {{ $labels.mountpoint }} is over 80% full"
          description: "Loki and Tempo have no total-size cap, so this alert is the storage backstop. Free space or lower retention (see RUNBOOK)."

  - name: container-lifecycle
    rules:
      - alert: ContainerRestarting
        expr: changes(container_start_time_seconds{name!=""}[1h]) > 3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} is crash-looping"
          description: "{{ $labels.name }} on {{ $labels.host_name }} has restarted more than 3 times in the last hour."

      - alert: ContainerOOMKilled
        expr: increase(container_oom_events_total[5m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} was OOM-killed"
          description: "{{ $labels.name }} on {{ $labels.host_name }} hit an OOM kill in the last 5 minutes."

  - name: service-red
    rules:
      # Server spans only, matching the Service Health dashboard. Without the
      # span_kind filter, internal child spans inflate the denominator and the
      # measured rate lands well under the true request error rate.
      - alert: HighErrorRate
        expr: >
          sum by (service) (rate(traces_spanmetrics_calls_total{span_kind="SPAN_KIND_SERVER",status_code="STATUS_CODE_ERROR"}[5m]))
          / sum by (service) (rate(traces_spanmetrics_calls_total{span_kind="SPAN_KIND_SERVER"}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} error rate above 5%"
          description: "More than 5% of spans from {{ $labels.service }} report errors (from Tempo span metrics)."
