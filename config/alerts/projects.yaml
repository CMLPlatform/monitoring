# Per-project "is anything arriving at all" alerts. One group per onboarded
# project — hand-written until step 7's bootstrap.sh generates these.
#
# Keyed on a label-only selector, not on any named metric: whichever exporter
# a spoke runs, every series it sends carries the four identity labels, so this
# keeps working if Alloy's self-scrape or the cAdvisor integration is turned
# off. Deliberately NOT keyed on target_info — Alloy attaches the identity
# labels as ordinary series labels, so target_info carries none of them.
# NOTE: the selector touches every series a project sends (~3k for relab).
# Cheap at this size; revisit if a project's active series reach five figures.

groups:
  - name: project-telemetry-relab
    rules:
      # absent() reports silence only once the series go stale, which adds the
      # 5m lookback on top of `for` — expect a page ~20m after the last sample.
      - alert: ProjectTelemetrySilent
        expr: absent({project="relab",env="staging"})
        for: 15m
        labels:
          severity: critical
          project: relab
          env: staging
        annotations:
          summary: "No telemetry from relab/staging in 15m"
          description: "Host down, Docker down, Alloy down, tunnel down, token rotated wrong, or the collector is rejecting relab's data. Nothing else on the Relab side can detect this on its own."
