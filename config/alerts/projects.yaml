# Per-project "is anything arriving at all" alerts. One group per onboarded
# project — hand-written until step 7's bootstrap.sh generates these.
# Uses Prometheus's synthetic target_info{} (materialized from OTLP resource
# attributes on any received metric batch) rather than an app- or
# cAdvisor-specific metric name, so it doesn't depend on OTLP metric-name
# translation surviving.

groups:
  - name: project-telemetry-relab
    rules:
      - alert: ProjectTelemetrySilent
        expr: absent(target_info{project="relab",env="production"})
        for: 15m
        labels:
          severity: critical
          project: relab
          env: production
        annotations:
          summary: "No telemetry from relab/production in 15m"
          description: "Host down, Docker down, Alloy down, tunnel down, token rotated wrong, or the collector is rejecting relab's data. Nothing else on the Relab side can detect this on its own."
