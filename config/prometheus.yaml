global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    origin: monitoring-host

storage:
  tsdb:
    # Required for OTLP ingestion: without it, late batches are silently dropped.
    out_of_order_time_window: 30m

otlp:
  # Otherwise these stay on target_info only and no alert or dashboard sees
  # them. service.name and service.instance.id become job/instance regardless.
  promote_resource_attributes: [department, project, env, host.name]

# No rule_files and no alerting block: Grafana owns both (ADR 0002).

# Apps push metrics via OTLP. Scrape only what this stack hosts.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Only `up` and grafana_alerting_notifications_failed_total are read from these
  # three; their histogram buckets were 5.2k of 14.1k head series. The _sum and
  # _count series stay, so latency is still visible in Explore.
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
    metric_relabel_configs: &drop_buckets
      - source_labels: [__name__]
        regex: .*_bucket
        action: drop

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
    metric_relabel_configs: *drop_buckets

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
    metric_relabel_configs: *drop_buckets
