global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    origin: monitoring-host

storage:
  tsdb:
    # OTel's guide requires this for OTLP ingestion — without it, late
    # batches are silently dropped.
    out_of_order_time_window: 30m

otlp:
  # Prometheus otherwise keeps these resource attributes on target_info only,
  # so alerts and dashboards see no project/env/host. Promoting them puts the
  # identity labels ADR 0002 requires on every series. service.name and
  # service.instance.id already become job/instance without being listed.
  promote_resource_attributes: [project, env, host.name]

rule_files:
  - /etc/prometheus/alerts/*.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# Apps push metrics via OTLP (through the collector). Scrape only infra we host.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Self-metrics of the remaining stack services, so TargetDown covers them too.
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
