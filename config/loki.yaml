# Single-binary Loki with filesystem storage.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2025-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 30d
  allow_structured_metadata: true
  volume_enabled: true
  max_line_size: 256kb
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  # Index only the identity labels below; everything else is structured
  # metadata. Loki's default mapping also indexes service.instance.id, which
  # mints a fresh stream on every sender restart. These five must be real
  # stream labels: dashboard template variables use label_values(), which
  # cannot see structured metadata.
  otlp_config:
    resource_attributes:
      ignore_defaults: true
      attributes_config:
        - action: index_label
          attributes:
            - service.name
            - department
            - project
            - env
            - host.name

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true

analytics:
  reporting_enabled: false
