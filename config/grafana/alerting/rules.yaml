# Grafana-managed alert rules (ADR 0002): one engine owns evaluation and notification,
# and Grafana rules can query Loki as well as Prometheus.
#
# Shape note, true for every rule here: the PromQL carries its own comparison, so it
# returns a series only when the alert should fire, and the threshold node only asks
# whether anything came back.
#
# Keep the total around a dozen. These are the generic rules; the per-project keystone
# lives in project-<project>-<env>.yaml beside this file, rendered by bootstrap.sh.
apiVersion: 1
groups:
  # The alerting pipeline's own proof of life, and the detector for it failing.
  - orgId: 1
    name: meta
    folder: Stack alerts
    interval: 1m
    rules:
      # Always firing; its arrival is the proof. execErrState is Error so that a
      # broken query stops the heartbeat and the switch alarms.
      - uid: watchdog-heartbeat
        title: Watchdog
        condition: FIRING
        for: 0m
        noDataState: OK
        execErrState: Error
        isPaused: false
        data:
          - refId: QUERY
            datasourceUid: prometheus
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              refId: QUERY
              instant: true
              editorMode: code
              expr: vector(1)
          - &firing
            # Identical on every rule (see the shape note up top): defined once
            # here, aliased as `- *firing` below.
            refId: FIRING
            datasourceUid: __expr__
            model:
              refId: FIRING
              type: threshold
              expression: QUERY
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        labels:
          severity: none
        annotations:
          summary: "Alerting-pipeline heartbeat (always firing)"
          description: "Routed to a dead man's switch. Investigate if the pings stop."
      # Cannot page when the path it reports on is the broken one; the heartbeat
      # covers that case. It makes the state visible instead of silent.
      - uid: alert-delivery-failing
        title: AlertDeliveryFailing
        condition: FIRING
        for: 10m
        noDataState: OK
        execErrState: Error
        isPaused: false
        data:
          - refId: QUERY
            datasourceUid: prometheus
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              refId: QUERY
              instant: true
              editorMode: code
              expr: rate(grafana_alerting_notifications_failed_total[10m]) > 0
          - *firing
        labels:
          severity: critical
        annotations:
          summary: "Grafana cannot deliver {{ $labels.integration }} notifications"
          description: >-
            Alerts are firing and going nowhere. Most likely an unset ALERT_WEBHOOK_URL,
            otherwise the receiver is rejecting. Check `just logs grafana`.
  # The central stack watching itself.
  - orgId: 1
    name: stack-health
    folder: Stack alerts
    interval: 1m
    rules:
      - uid: target-down
        title: TargetDown
        condition: FIRING
        for: 2m
        noDataState: OK
        execErrState: Error
        isPaused: false
        data:
          - refId: QUERY
            datasourceUid: prometheus
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              refId: QUERY
              instant: true
              editorMode: code
              expr: up == 0
          - *firing
        labels:
          severity: critical
        annotations:
          summary: "Scrape target {{ $labels.job }} is down"
          description: "Prometheus cannot scrape {{ $labels.instance }} (job {{ $labels.job }}) for 2 minutes."
      - uid: otel-export-failures
        title: OtelExportFailures
        condition: FIRING
        for: 5m
        noDataState: OK
        execErrState: Error
        isPaused: false
        data:
          - refId: QUERY
            datasourceUid: prometheus
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              refId: QUERY
              instant: true
              editorMode: code
              expr: >
                sum by (exporter) (rate(otelcol_exporter_send_failed_spans[5m])) > 0
                or sum by (exporter) (rate(otelcol_exporter_send_failed_metric_points[5m])) > 0
                or sum by (exporter) (rate(otelcol_exporter_send_failed_log_records[5m])) > 0
          - *firing
        labels:
          severity: warning
        annotations:
          summary: "OTel Collector failing to export via {{ $labels.exporter }}"
          description: >-
            The collector has been failing to deliver telemetry to a backend for
            5 minutes. Check `just logs otel-collector`.
  # Storage backstop: Loki and Tempo have no total-size cap.
  - orgId: 1
    name: capacity
    folder: Stack alerts
    interval: 1m
    rules:
      - uid: host-disk-space-low
        title: HostDiskSpaceLow
        condition: FIRING
        for: 15m
        noDataState: OK
        execErrState: Error
        isPaused: false
        data:
          - refId: QUERY
            datasourceUid: prometheus
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              refId: QUERY
              instant: true
              editorMode: code
              expr: >
                (node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay"}
                / node_filesystem_size_bytes{fstype!~"tmpfs|ramfs|overlay"}) < 0.2
          - *firing
        labels:
          severity: warning
        annotations:
          # host_name comes on spoke series shipped via Alloy; the central
          # node-exporter has only instance. `or` picks whichever exists.
          summary: "Filesystem {{ $labels.mountpoint }} on {{ or $labels.host_name $labels.instance }} is over 80% full"
          description: >-
            Loki and Tempo have no total-size cap, so this alert is the storage
            backstop. Free space or lower retention (see RUNBOOK).
      # The 20% floor above is a last line; this one fires while there is still
      # time to act. Linear fit over 6h, projected 3 days out. Root and data
      # mounts only: a sub-10G filesystem (boot, EFI, snap) crosses zero on
      # noise and is not where telemetry lands.
      - uid: host-disk-filling
        title: HostDiskFilling
        condition: FIRING
        for: 30m
        noDataState: OK
        execErrState: Error
        isPaused: false
        data:
          - refId: QUERY
            datasourceUid: prometheus
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              refId: QUERY
              instant: true
              editorMode: code
              expr: >
                predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay"}[6h], 3 * 86400) < 0
                and node_filesystem_size_bytes{fstype!~"tmpfs|ramfs|overlay"} > 10e9
          - *firing
        labels:
          severity: warning
        annotations:
          summary: "Filesystem {{ $labels.mountpoint }} on {{ or $labels.host_name $labels.instance }} fills up within 3 days at the current rate"
          description: >-
            Extrapolated from the last 6 hours. Find what is growing (a spoke
            shipping more than before, a log loop, a backup that stopped
            rotating) before HostDiskSpaceLow makes it urgent.
      # TSDB growth is series count, not time. A spoke that starts labelling by
      # request id shows here days before it reaches the 15GB retention cap,
      # and long before HostDiskSpaceLow. The threshold is ~7x the baseline
      # of ~15k series with one spoke; raise it as spokes are onboarded.
      - uid: prometheus-cardinality
        title: PrometheusCardinalityHigh
        condition: FIRING
        for: 30m
        noDataState: OK
        execErrState: Error
        isPaused: false
        data:
          - refId: QUERY
            datasourceUid: prometheus
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              refId: QUERY
              instant: true
              editorMode: code
              expr: prometheus_tsdb_head_series > 100000
          - *firing
        labels:
          severity: warning
        annotations:
          summary: "Prometheus holds {{ $values.QUERY }} active series, over the 100k ceiling"
          description: >-
            Find the label that exploded with
            `topk(10, count by (__name__) ({__name__=~".+"}))` and
            `topk(10, count by (job) ({__name__=~".+"}))`, then drop it at the
            spoke's Alloy config or the collector. Retention is 15GB; at this
            rate it fills.
  # A crash loop must get louder, not quieter.
  - orgId: 1
    name: container-lifecycle
    folder: Stack alerts
    interval: 1m
    rules:
      - uid: container-restarting
        title: ContainerRestarting
        condition: FIRING
        for: 10m
        noDataState: OK
        execErrState: Error
        isPaused: false
        data:
          - refId: QUERY
            datasourceUid: prometheus
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              refId: QUERY
              instant: true
              editorMode: code
              expr: changes(container_start_time_seconds{name!=""}[1h]) > 3
          - *firing
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} is crash-looping"
          description: "{{ $labels.name }} on {{ $labels.host_name }} has restarted more than 3 times in the last hour."
      - uid: container-oom-killed
        title: ContainerOOMKilled
        condition: FIRING
        for: 0m
        noDataState: OK
        execErrState: Error
        isPaused: false
        data:
          - refId: QUERY
            datasourceUid: prometheus
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              refId: QUERY
              instant: true
              editorMode: code
              expr: increase(container_oom_events_total[5m]) > 0
          - *firing
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} was OOM-killed"
          description: "{{ $labels.name }} on {{ $labels.host_name }} hit an OOM kill in the last 5 minutes."
  # RED from the applications' own OTLP metrics, not Tempo's span-metrics.
  - orgId: 1
    name: service-red
    folder: Stack alerts
    interval: 1m
    rules:
      - uid: high-error-rate
        title: HighErrorRate
        condition: FIRING
        for: 5m
        noDataState: OK
        execErrState: Error
        isPaused: false
        data:
          - refId: QUERY
            datasourceUid: prometheus
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              refId: QUERY
              instant: true
              editorMode: code
              # Keyed on (job, project, env) like every other multi-tenant rule
              # here: aggregating on job alone lets a healthy prod service dilute
              # a broken staging one sharing the job name below the threshold.
              expr: >
                sum by (job, project, env)
                (rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m]))
                / sum by (job, project, env) (rate(http_server_request_duration_seconds_count[5m])) > 0.05
          - *firing
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.project }}/{{ $labels.env }} {{ $labels.job }} error rate above 5%"
          description: >-
            More than 5% of requests to {{ $labels.job }}
            ({{ $labels.project }}/{{ $labels.env }}) returned 5xx over the last 5 minutes.
