# GENERATED by bootstrap.sh — do not edit. Regenerated on every run.
#
# The trap this closes: ProjectTelemetrySilent only exists for projects bootstrap.sh was
# actually run for. A project that ships telemetry but skipped bootstrap is silently
# uncovered — the exact failure class the keystone closes, one level up. This fires on
# any series carrying a project label that has no rendered rule file.
#
# Covered right now: relab

apiVersion: 1

groups:
  - orgId: 1
    name: _coverage
    folder: Stack alerts
    interval: 5m
    rules:
      - uid: projects-uncovered
        title: ProjectsUncovered
        condition: FIRING
        for: 15m
        noDataState: OK
        execErrState: Error
        isPaused: false
        data:
          - refId: QUERY
            datasourceUid: prometheus
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              refId: QUERY
              instant: true
              editorMode: code
              expr: count by (project) ({project!~"relab", project!=""})
          - refId: FIRING
            datasourceUid: __expr__
            model:
              refId: FIRING
              type: threshold
              expression: QUERY
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        labels:
          severity: warning
        annotations:
          summary: "Project {{ $labels.project }} is sending telemetry but has no alert rules"
          description: "Telemetry is arriving for a project bootstrap.sh was never run for, so nothing would notice if it went silent. Run ./bootstrap.sh {{ $labels.project }} <env> on the monitoring host."
