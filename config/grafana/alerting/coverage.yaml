# GENERATED by bootstrap.sh from templates/alerting/coverage.yaml.tmpl. Do not edit
# the rendered file; it is regenerated on every run.
#
# Fires on any series whose project/env pair has no rendered rule file: a project that
# ships telemetry but was never bootstrapped has no ProjectTelemetrySilent rule.
#
# Covered right now: relab/staging (plus demo/demo, exempt: see below)

apiVersion: 1

groups:
  - orgId: 1
    name: _coverage
    folder: Stack alerts
    interval: 5m
    rules:
      - uid: projects-uncovered
        title: ProjectsUncovered
        condition: FIRING
        for: 15m
        noDataState: OK
        execErrState: Error
        isPaused: false
        data:
          - refId: QUERY
            datasourceUid: prometheus
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              refId: QUERY
              instant: true
              editorMode: code
              # The collector's count connector (config/otel-collector.yaml) mints these
              # counters for every sender, whatever signal it sends. A bare
              # {project!=""} would scan every project-labelled series in the TSDB on
              # each evaluation, and would still miss a logs-only or traces-only project.
              #
              # demo/demo is exempt. It is this repo's own `just demo` overlay, which
              # runs in its own throwaway stack and is torn down again; bootstrapping
              # it would leave a ProjectTelemetrySilent rule firing forever after
              # `just demo-down`. Exempt as a pair, so a real project named demo in a
              # real env is still caught.
              expr: count by (project, env) ({__name__=~"telemetry_.+_total", project!="", env!=""} unless on (project, env) ({__name__=~"telemetry_.+_total", project="demo", env="demo"} or {__name__=~"telemetry_.+_total", project="relab",env="staging"}))
          - refId: FIRING
            datasourceUid: __expr__
            model:
              refId: FIRING
              type: threshold
              expression: QUERY
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.project }}/{{ $labels.env }} is sending telemetry but has no alert rules"
          description: "Telemetry is arriving for a project/environment bootstrap.sh was never run for, so nothing would notice if it went silent. Run ./bootstrap.sh {{ $labels.project }} {{ $labels.env }} on the monitoring host. A literal `unknown` means the sender set no project or env resource attribute at all: fix the sender (docs/ONBOARDING.md), do not bootstrap a project by that name."
