# GENERATED by bootstrap.sh from templates/alerting/coverage.yaml.tmpl. Do not edit
# the rendered file; it is regenerated on every run.
#
# Fires on any series whose project/env pair has no rendered rule file: a project that
# ships telemetry but was never bootstrapped has no ProjectTelemetrySilent rule.
#
# Covered right now: relab/staging

apiVersion: 1

groups:
  - orgId: 1
    name: _coverage
    folder: Stack alerts
    interval: 5m
    rules:
      - uid: projects-uncovered
        title: ProjectsUncovered
        condition: FIRING
        for: 15m
        noDataState: OK
        execErrState: Error
        isPaused: false
        data:
          - refId: QUERY
            datasourceUid: prometheus
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              refId: QUERY
              instant: true
              editorMode: code
              expr: count by (project, env) ({project!="", env!=""} unless on (project, env) ({project="relab",env="staging"}))
          - refId: FIRING
            datasourceUid: __expr__
            model:
              refId: FIRING
              type: threshold
              expression: QUERY
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.project }}/{{ $labels.env }} is sending telemetry but has no alert rules"
          description: "Telemetry is arriving for a project/environment bootstrap.sh was never run for, so nothing would notice if it went silent. Run ./bootstrap.sh {{ $labels.project }} {{ $labels.env }} on the monitoring host."
