# Rendered by bootstrap.sh into config/grafana/alerting/, flat: Grafana's alerting
# provisioner does not recurse. Do not edit the rendered files by hand. Re-run
# bootstrap.sh, or edit this template so every project gets the fix.
#
# This is the keystone: nothing on a project host can detect its own absence. A project
# that ships telemetry but never had bootstrap.sh run is silently uncovered, which is
# what the ProjectsUncovered rule in coverage.yaml catches one level up.
#
# bootstrap.sh reads the marker below back to regenerate that coverage rule. It carries
# the pair, not the filename, because both halves may contain a dash: `project-a-b-c`
# cannot be split back into the project and env that produced it.
# COVERS: relab staging

apiVersion: 1

groups:
  - orgId: 1
    name: project-relab-staging
    folder: Stack alerts
    interval: 1m
    rules:
      # A label-only selector, not target_info: agents attach the identity labels to
      # the series themselves, so target_info carries none of them. absent()
      # yields nothing while telemetry flows, so NoData is the HEALTHY state and must
      # map to OK or the rule reads inverted.
      - uid: proj-silent-relab-staging
        title: ProjectTelemetrySilent
        condition: FIRING
        for: 15m
        noDataState: OK
        execErrState: Error
        isPaused: false
        data:
          - refId: QUERY
            datasourceUid: prometheus
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              refId: QUERY
              instant: true
              editorMode: code
              expr: absent({project="relab",env="staging"})
          - refId: FIRING
            datasourceUid: __expr__
            model:
              refId: FIRING
              type: threshold
              expression: QUERY
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        labels:
          severity: critical
          project: relab
          env: staging
        annotations:
          summary: "No telemetry from relab/staging in 15m"
          description: "Host down, Docker down, the agent down, tunnel down, token rotated wrong, or the collector is rejecting this project's data. Nothing on the relab side can detect this on its own. Expect this ~20m after the last sample: absent() needs the series to go stale first."
