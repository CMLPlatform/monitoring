# Destination credentials live only in notification-relay, outside Grafana.

apiVersion: 1

contactPoints:
  - orgId: 1
    name: webhook
    receivers:
      - uid: cp-webhook-default
        type: webhook
        settings:
          url: http://notification-relay:8080/alerts

  - orgId: 1
    name: heartbeat
    receivers:
      - uid: cp-heartbeat-dms
        type: webhook
        settings:
          url: http://notification-relay:8080/heartbeat
        # A resolved-notification would ping the switch and mask an outage.
        disableResolveMessage: true
