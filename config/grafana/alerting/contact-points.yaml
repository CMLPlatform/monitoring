# Notification targets. Grafana expands $VAR from the environment.
#
# Each receiver needs a URL or Grafana rejects contact point provisioning.
# The demo and smoke stacks supply isolated placeholders. The exposure guard
# in `just up` requires a production alert destination.

apiVersion: 1

contactPoints:
  - orgId: 1
    name: webhook
    receivers:
      - uid: cp-webhook-default
        type: webhook
        settings:
          url: $ALERT_WEBHOOK_URL

  - orgId: 1
    name: heartbeat
    receivers:
      - uid: cp-heartbeat-dms
        type: webhook
        settings:
          url: $HEARTBEAT_URL
        # A resolved-notification would ping the switch and mask an outage.
        disableResolveMessage: true
