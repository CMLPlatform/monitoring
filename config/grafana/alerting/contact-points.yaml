# Notification targets. Grafana expands $VAR in provisioning files, so the URLs come
# straight from the environment and no secret is written to disk.
#
# An unset variable leaves the URL empty and every notification fails — silently, from
# the outside. Nothing here catches that: AlertDeliveryFailing routes to this same
# webhook, so it fails exactly the way it is detecting, and the heartbeat rides its own
# contact point and stays green throughout. The guard in `just up-tunnel` is the only
# control. AlertDeliveryFailing earns its place for the other case — a URL that is set
# but whose receiver is rejecting or flapping, where a later retry does get through.

apiVersion: 1

contactPoints:
  - orgId: 1
    name: webhook
    receivers:
      - uid: cp-webhook-default
        type: webhook
        settings:
          url: $ALERT_WEBHOOK_URL

  - orgId: 1
    name: heartbeat
    receivers:
      - uid: cp-heartbeat-dms
        type: webhook
        settings:
          url: $HEARTBEAT_URL
        # A resolved-notification would ping the dead man's switch too, which
        # would mask the very outage the switch exists to report.
        disableResolveMessage: true
