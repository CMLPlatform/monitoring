apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 30s
      exemplarTraceIdDestinations:
        - name: traceID
          datasourceUid: tempo

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # Click a trace_id in a log line → jump to the trace in Tempo.
      derivedFields:
        - name: trace_id
          matcherRegex: "[tT]race[_-]?[iI][dD][\"=:\\s]+([A-Fa-f0-9]+)"
          url: "$${__value.raw}"
          datasourceUid: tempo
        # Same, for OTLP logs where trace_id is structured metadata, not body text.
        - name: trace_id (otlp)
          matcherType: label
          matcherRegex: trace_id
          url: "$${__value.raw}"
          datasourceUid: tempo

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        tags:
          - key: service.name
            value: service_name
      # No tracesToMetrics/serviceMap/nodeGraph: all three need span-metrics series
      # this stack does not generate (RED comes from the apps' own OTLP metrics,
      # ADR 0002). Configured anyway, they render a permanently empty service graph
      # that reads as "no traffic".
