# Blackbox exporter configuration for outside-in uptime monitoring
modules:
  http_2xx:
    prober: http
    timeout: 10s
    http:
      valid_status_codes: [] # Defaults to 2xx
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      method: GET
      follow_redirects: true
      fail_if_ssl: false
      fail_if_not_ssl: false
      tls_config:
        insecure_skip_verify: false
