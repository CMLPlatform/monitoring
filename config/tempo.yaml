# Tempo 3.x single-binary. Traces arrive only from the collector
# (collector → tempo:4317) so external apps never talk to Tempo directly.
# Block retention lives under overrides.

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        # gRPC only: the collector is the sole sender (otlp_grpc/tempo).
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# No metrics_generator: RED comes from the applications' own OTLP metrics (ADR 0002).
# Deriving it from traces as well meant two producers for one number, a Prometheus
# remote-write path that existed for nothing else, and a cardinality backstop to
# maintain. Tempo is trace storage now, which makes it disposable on its next
# breaking upgrade.

overrides:
  defaults:
    compaction:
      block_retention: 168h  # 7 days — traces are bulky, tune to disk budget

usage_report:
  reporting_enabled: false
