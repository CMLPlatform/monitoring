# Tempo single-binary. Traces arrive only from the collector.

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# No metrics_generator: RED comes from the applications' own OTLP metrics (ADR 0002).

overrides:
  defaults:
    compaction:
      block_retention: 168h # 7 days

usage_report:
  reporting_enabled: false
