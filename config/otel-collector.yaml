# Ingestion gateway: receives OTLP from all projects and fans out to the
# backends. Keep it dumb; shaping and enrichment belong at the app edge.

extensions:
  bearertokenauth:
    token: ${env:OTLP_AUTH_TOKEN}
  # Backs the exporter queues so buffered telemetry survives a collector
  # restart. The directory must be writable by uid 10001; `just up` chowns it.
  file_storage:
    directory: /var/lib/otelcol/queue
    create_directory: true

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        auth:
          authenticator: bearertokenauth
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: bearertokenauth

connectors:
  # A per-(project, env) ingest counter for every signal. The coverage and silence
  # rules ask "is this project sending anything?" against a handful of series per
  # project instead of scanning every project-labelled series in the TSDB, and they
  # see a logs-only or traces-only project, which reaches no other Prometheus series.
  # Attributes are read from the resource too, which is where project and env live.
  #
  # Every data type is named, including the two that carry no project: a type left
  # undefined emits the connector's own default metric instead. The rules match
  # telemetry_.+_total and key on the project label, so the two without it never
  # reach them.
  count:
    datapoints:
      telemetry.datapoints: &by_project
        description: Telemetry received, by project and environment.
        # default_value, or a sender that never set project is counted nowhere and
        # stays invisible: no series, so nothing for the coverage rule to fire on.
        # Counted as "unknown" it shows up as an uncovered project instead.
        attributes:
          - key: project
            default_value: unknown
          - key: env
            default_value: unknown
    logs:
      telemetry.logs: *by_project
    spans:
      telemetry.spans: *by_project
    # Neither of these is read by a rule. A metric stream has no attributes of its
    # own (its datapoints carry them), and span events are only ever counted
    # alongside their spans, so one series each is enough.
    spanevents:
      telemetry.spanevents:
        description: Span events received.
    metrics:
      telemetry.metrics:
        description: Metric streams received.

processors:
  # Stamped here with upsert, so a sender cannot claim another department.
  # Literal rather than an env knob: one value has ever been correct, and a knob here
  # is a silent-failure surface. A hub brought up with the wrong value mislabels every
  # signal and mints a parallel set of Loki streams, with nothing to catch it. Make it
  # a variable when a second department runs its own hub; if one ever federates into
  # this one, the upsert itself is what has to go.
  resource/department:
    attributes:
      - key: department
        value: cml
        action: upsert

  # The count connector emits delta sums and the Prometheus OTLP receiver refuses
  # them ("invalid temporality and type combination"). Converting here keeps the
  # conversion state to the counter streams, rather than turning on Prometheus's
  # experimental global delta handling.
  #
  # A stream is per sender resource, not per project: the counters carry the
  # sender's service.instance.id, so one spoke already tracks ~28 and a service
  # that mints a new instance id on each restart adds one every time. The default
  # limit is unbounded. Cap it: at 28 streams the process sits at ~51 MiB heap
  # against the 400 MiB limiter below, so this is a runaway guard, not a budget.
  deltatocumulative:
    max_streams: 5000

  # The count connector emits one ResourceMetrics per incoming batch and never
  # merges identical ones, so a spoke that ships 50 ResourceLogs at once produces
  # 50 datapoints for one counter stream, microseconds apart. Prometheus sees
  # duplicate samples for one series in one write and rejects the whole request
  # with a 400. Collapsing each stream to its latest value per scrape interval is
  # what the counter meant all along; 30s matches scrape_interval in
  # config/prometheus.yaml.
  interval:
    interval: 30s

  # These counters answer "what has the hub received", so they are stamped when the
  # hub receives it. Left alone, the count connector inherits the source telemetry's
  # own timestamp: a spoke shipping a backlog of logs mints counter samples hours
  # old, Prometheus refuses anything past out_of_order_time_window (30m in
  # config/prometheus.yaml) and 400s the whole write. Must run after `interval`,
  # which collapses a stream to one datapoint first; restamping several datapoints
  # of one stream would make them duplicate samples instead.
  transform/count_ingest_time:
    metric_statements:
      - context: datapoint
        statements:
          - set(time, Now())

  # Sized to the container's mem_limit (512m in compose.yml); keep the two in step.
  memory_limiter:
    check_interval: 2s
    limit_mib: 400
    spike_limit_mib: 100
  batch:
    timeout: 5s
    send_batch_size: 1024

# The RUNBOOK's "buffers about five minutes" promise is max_elapsed_time below.
# Defined once on the loki exporter and aliased onto the other two.
exporters:
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    sending_queue: &queue
      queue_size: 1000
      storage: file_storage
    retry_on_failure: &retry
      max_elapsed_time: 300s

  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    sending_queue: *queue
    retry_on_failure: *retry

  # Needs --web.enable-otlp-receiver in compose.yml.
  otlp_http/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp
    sending_queue: *queue
    retry_on_failure: *retry

  # Same endpoint, separate instance, so otelcol_exporter_send_failed_metric_points
  # is labelled by pipeline. Shared, a rejected batch of ingest counters and a
  # rejected batch of a spoke's application metrics are one number.
  otlp_http/prometheus_count:
    endpoint: http://prometheus:9090/api/v1/otlp
    sending_queue: *queue
    retry_on_failure: *retry

service:
  extensions: [bearertokenauth, file_storage]
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/department, batch]
      exporters: [otlp_http/loki, count]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/department, batch]
      exporters: [otlp_grpc/tempo, count]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource/department, batch]
      exporters: [otlp_http/prometheus, count]
    # The counters themselves. No batcher, unlike every other pipeline: after
    # deltatocumulative it handed on datapoints whose timestamps had regressed,
    # ~1/min, which deltatocumulative then refused as out of order. Without it that
    # stopped dead. `interval` then collapses each stream to one sample per scrape,
    # which is what makes the export safe for Prometheus; see the processor.
    metrics/count:
      receivers: [count]
      processors: [memory_limiter, deltatocumulative, interval, transform/count_ingest_time]
      exporters: [otlp_http/prometheus_count]
  telemetry:
    metrics:
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
