# Ingestion gateway: receives OTLP from all projects and fans out to the
# backends. Keep it dumb; shaping and enrichment belong at the app edge.

extensions:
  bearertokenauth:
    token: ${env:OTLP_AUTH_TOKEN}
  # Backs the exporter queues so buffered telemetry survives a collector
  # restart. The directory must be writable by uid 10001; `just up` chowns it.
  file_storage:
    directory: /var/lib/otelcol/queue
    create_directory: true

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        auth:
          authenticator: bearertokenauth
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: bearertokenauth

processors:
  # Stamped here with upsert, so a sender cannot claim another department.
  # Literal rather than an env knob: one value has ever been correct, and as an
  # indexed Loki stream label a second one would be an index dimension, not a
  # filter. Make it a variable again when a second department federates.
  resource/department:
    attributes:
      - key: department
        value: cml
        action: upsert

  # Sized to the container's mem_limit (512m in compose.yml); keep the two in step.
  memory_limiter:
    check_interval: 2s
    limit_mib: 400
    spike_limit_mib: 100
  batch:
    timeout: 5s
    send_batch_size: 1024

# The RUNBOOK's "buffers about five minutes" promise is max_elapsed_time below.
# Defined once on the loki exporter and aliased onto the other two.
exporters:
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    sending_queue: &queue
      queue_size: 1000
      storage: file_storage
    retry_on_failure: &retry
      max_elapsed_time: 300s

  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    sending_queue: *queue
    retry_on_failure: *retry

  # Needs --web.enable-otlp-receiver in compose.yml.
  otlp_http/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp
    sending_queue: *queue
    retry_on_failure: *retry

service:
  extensions: [bearertokenauth, file_storage]
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/department, batch]
      exporters: [otlp_http/loki]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/department, batch]
      exporters: [otlp_grpc/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource/department, batch]
      exporters: [otlp_http/prometheus]
  telemetry:
    metrics:
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
