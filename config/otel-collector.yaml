# Ingestion gateway. Receives OTLP from all projects and fans out to the
# appropriate backend. Keep this config dumb — do shaping/enrichment at the
# app edge (per-project collector) where it has context.

# All senders must present "Authorization: Bearer <OTLP_AUTH_TOKEN>". The
# OTLP hostnames are public behind the tunnel, so ingestion needs auth.
extensions:
  bearertokenauth:
    token: ${env:OTLP_AUTH_TOKEN}
  # Backs the exporter queues below so buffered telemetry survives collector
  # restarts (every image bump is one). The volume must be writable by the
  # image's uid 10001 — `just up` handles that (see _queue-volume).
  file_storage:
    directory: /var/lib/otelcol/queue
    create_directory: true

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        auth:
          authenticator: bearertokenauth
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: bearertokenauth

processors:
  # Absolute, not percentage: percentages are read against the cgroup, and an
  # unbounded container makes that the whole host. Sized to the container's
  # mem_limit (512m in compose.yml) — change both together.
  memory_limiter:
    check_interval: 2s
    limit_mib: 400
    spike_limit_mib: 100
  batch:
    timeout: 5s
    send_batch_size: 1024

# The queue/retry settings are pinned rather than left to upstream defaults,
# because the RUNBOOK's "buffers about five minutes" promise is exactly those
# numbers. Defined once on the loki exporter, aliased onto the other two. The
# queue is file-backed, so both a backend outage and a collector restart are
# ridden out.
exporters:
  # Loki 3.x accepts OTLP natively — no Promtail / loki exporter needed.
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    sending_queue: &queue
      queue_size: 1000
      storage: file_storage
    retry_on_failure: &retry
      max_elapsed_time: 300s

  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    sending_queue: *queue
    retry_on_failure: *retry

  # Prometheus native OTLP receiver (needs --web.enable-otlp-receiver, set in
  # compose.yml; it is a real flag, not an --enable-feature entry).
  otlp_http/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp
    sending_queue: *queue
    retry_on_failure: *retry

service:
  extensions: [bearertokenauth, file_storage]
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/loki]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/prometheus]
  telemetry:
    metrics:
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
