[project]
  dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "opentelemetry-distro==0.65b0",
    "opentelemetry-exporter-otlp==1.44.0",
    "opentelemetry-instrumentation-fastapi==0.65b0",
  ]
  name = "demo"
  requires-python = ">=3.14"
  version = "0.1.0"

# The ruff config lives here so lint results do not depend on whatever config the
# contributor has at home. target-version is explicit because requires-python is
# ahead of what released ruff knows about.
[tool.ruff]
  target-version = "py313"

  [tool.ruff.lint]
    ignore = [
      "D203", # line too long
      "E203", # whitespace before ':'
      "W503", # line break before binary operator
    ]
    select = ["ALL"]
