[project]
  dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "opentelemetry-distro==0.66b1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-instrumentation-fastapi==0.66b1",
  ]
  name = "demo"
  requires-python = ">=3.14"
  version = "0.1.0"

# The ruff config lives here so lint results do not depend on whatever config the
# contributor has at home. target-version is explicit because requires-python is
# ahead of what released ruff knows about.
[tool.ruff]
  target-version = "py313"

  [tool.ruff.lint]
    pydocstyle.convention = "google"
    select                = ["ALL"]
    # COM812 fights the formatter (`ruff format --check` runs in `just lint`).
    ignore                = ["COM812"]
