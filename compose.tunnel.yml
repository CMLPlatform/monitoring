# Production overlay: expose Grafana and the OTLP endpoint via Cloudflare Tunnel.
#
#   COMPOSE_FILE=compose.yml:compose.tunnel.yml in .env, then `just up`
#
# The tunnel, its hostnames, and DNS are OpenTofu in infra/;
# `tofu output -raw tunnel_token` yields CLOUDFLARE_TUNNEL_TOKEN for .env.
services:
  cloudflared:
    image: cloudflare/cloudflared:2026.10.1@sha256:a15a3b50b8dabd57ac2090e9484c0247dba9dfa1f0df4d298d4317f9d69eb2d5
    restart: unless-stopped
    depends_on: [grafana, otel-collector]
    # Token via env, not --token: argv is readable from the host and from any
    # container with pid:host (node-exporter has it).
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    mem_limit: 256m
    pids_limit: 256
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
