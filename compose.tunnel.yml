# Production overlay: expose Grafana (and the OTLP endpoints) via Cloudflare
# Tunnel. Requires CLOUDFLARE_TUNNEL_TOKEN in .env.
#
#   just up-tunnel
#
# The tunnel, its public hostnames, and DNS are managed as code in infra/
# (OpenTofu); `tofu output -raw tunnel_token` yields the token for .env.
# See infra/main.tf for the bootstrap steps.

services:
  cloudflared:
    image: cloudflare/cloudflared:2026.7.0
    restart: unless-stopped
    depends_on: [ grafana, otel-collector ]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
