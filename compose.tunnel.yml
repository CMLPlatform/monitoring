# Production overlay: expose Grafana (and the OTLP endpoints) via Cloudflare
# Tunnel. Requires CLOUDFLARE_TUNNEL_TOKEN in .env.
#
#   COMPOSE_FILE=compose.yml:compose.tunnel.yml in .env, then `just up`
#
# The tunnel, its public hostnames, and DNS are managed as code in infra/
# (OpenTofu); `tofu output -raw tunnel_token` yields the token for .env.
# See infra/main.tf for the bootstrap steps.

services:
  cloudflared:
    image: cloudflare/cloudflared:2026.8.2@sha256:0aa26e284f05e6c77ae375b8c9c11d9eb6a448fb7bcd8d40f31cb6176189eb38
    restart: unless-stopped
    depends_on: [grafana, otel-collector]
    # Token via env, not argv: --token would sit in the process table, readable
    # from the host and from any container with pid:host (node-exporter has it).
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    # Ceiling sized from observed usage with headroom; see compose.yml.
    mem_limit: 256m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
