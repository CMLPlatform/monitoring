version: 2
updates:
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      monitoring-stack-updates:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/demo"
    schedule:
      interval: "monthly"

  - package-ecosystem: "pip"
    directory: "/demo"
    schedule:
      interval: "monthly"

  # Cloudflare provider for infra/. Dependabot bumps the constraint in
  # main.tf but not the hashes in .terraform.lock.hcl — see the runbook.
  - package-ecosystem: "terraform"
    directory: "/infra"
    schedule:
      interval: "monthly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
