version: 2
updates:
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      monitoring-stack-updates:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/demo"
    schedule:
      interval: "monthly"

  - package-ecosystem: "pip"
    directory: "/demo"
    schedule:
      interval: "monthly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
