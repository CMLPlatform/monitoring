version: 2
updates:
  # Hub images: patch and minor bumps ride together, a major comes on its own
  # so a red PR names the one image that broke. `just check` runs on the group
  # PR; bisect it by dropping images from the branch if it goes red.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      hub:
        update-types: ["minor", "patch"]

  # The spoke images every project host runs.
  - package-ecosystem: "docker-compose"
    directory: "/templates"
    schedule:
      interval: "weekly"
    groups:
      spoke:
        update-types: ["minor", "patch"]

  # The demo: one PR per month for all of it.
  - package-ecosystem: "docker"
    directory: "/demo"
    schedule:
      interval: "monthly"
    groups:
      demo:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/demo"
    schedule:
      interval: "monthly"
    groups:
      demo:
        patterns: ["*"]
      # `groups` only cover version updates; without this every advisory opens
      # its own PR. Only pip gets Dependabot security advisories here.
      demo-security:
        applies-to: security-updates
        patterns: ["*"]

  # Cloudflare provider for infra/. Dependabot bumps the constraint in
  # main.tf but not the hashes in .terraform.lock.hcl; see the runbook.
  - package-ecosystem: "terraform"
    directory: "/infra"
    schedule:
      interval: "monthly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
