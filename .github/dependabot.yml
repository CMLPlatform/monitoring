version: 2
updates:
  # Deliberately ungrouped: a grouped bump that fails `just check` or `just
  # smoke` gives no clue which of six images broke it, and bisecting a
  # Dependabot PR by hand is worse than reviewing six small ones.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"

  # The spoke images every project host runs (Alloy, socket proxy, GPU
  # exporter). Digest pins keep them reproducible, not patched.
  - package-ecosystem: "docker-compose"
    directory: "/templates"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/demo"
    schedule:
      interval: "monthly"

  - package-ecosystem: "pip"
    directory: "/demo"
    schedule:
      interval: "monthly"

  # Cloudflare provider for infra/. Dependabot bumps the constraint in
  # main.tf but not the hashes in .terraform.lock.hcl — see the runbook.
  - package-ecosystem: "terraform"
    directory: "/infra"
    schedule:
      interval: "monthly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
