name: scorecard

# OpenSSF Scorecard: rates the repository's supply-chain practices, publishes the score for the
# README badge, and uploads the findings to code scanning. With publish_results, the job may only
# use approved actions and no workflow-level env or write permissions.
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 2" # Tuesdays, 04:41 UTC
  # Branch protection is one of the checks.
  branch_protection_rule:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # to upload the SARIF file
      id-token: write # to publish the results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
