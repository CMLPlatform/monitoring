name: Bug report
description: Something does not work as the docs say
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Report a vulnerability as SECURITY.md says, not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest set of commands or code that shows the bug.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release or commit you used.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Host operating system, and the Docker and Compose versions (`docker version`, `docker compose version`).
