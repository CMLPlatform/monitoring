# Installed by `just hooks` (prek).
#   pre-commit  gitleaks on the staged diff; CITATION.cff against its schema
#               and citesync
#   commit-msg  Conventional Commits shape on the first line
#   pre-push    `just check`, plus `just infra-validate` when infra/ changed
# `prek run` runs the pre-commit stage on demand; `--hook-stage pre-push` the rest.
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (staged)
        entry: just _gitleaks-staged
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: commit-msg
        name: conventional commit message
        entry: >-
          sh -c 'head -n1 "$1"
          | grep -Eq "^((build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9._/-]+\))?!?:
          [a-z].{0,81}|(Merge|Revert|fixup!|squash!) .*)$"
          || { echo "commit message must be type(scope): lower-case summary, at most 82 chars" >&2; exit 1; }' --
        language: system
        stages: [commit-msg]
      - id: check
        name: just check
        entry: just check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: infra-validate
        name: just infra-validate
        entry: just infra-validate
        language: system
        pass_filenames: false
        files: ^infra/
        stages: [pre-push]

  # GitHub's "Cite this repository" silently drops a CITATION.cff that fails its schema.
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0494aa7fa1314e98913a41227d8f0a515b2c1049 # frozen: 0.38.2
    hooks:
      - id: check-citation-file-format

  # CITATION.cff is the source: any codemeta.json or .zenodo.json must agree with it, and
  # `prek run citesync-write --hook-stage manual --all-files` rewrites them to match.
  - repo: https://github.com/simonvanlierde/citesync
    rev: a3c5a9794449e78a33583e456af41bb24ebd240e # frozen: v0.1.0
    hooks:
      - id: citesync
      - id: citesync-write
