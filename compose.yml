name: monitoring

# Central observability stack.
#   OTel Collector  →  ingestion gateway (OTLP gRPC 4317 / HTTP 4318)
#   Loki            →  logs
#   Tempo           →  traces  (OTLP-native; Grafana has first-class support)
#   Prometheus      →  metrics (native OTLP remote-write-receiver)
#   Grafana         →  UI
#
# Projects ship telemetry to this host via OTLP. Do NOT publish :4317/:4318
# directly to the public internet — expose via Cloudflare Tunnel, Tailscale,
# WireGuard, or similar. The port bindings below are bound to 127.0.0.1 so
# they are only reachable from the host / tunnel sidecar.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.155.0
    restart: unless-stopped
    depends_on: [ loki, tempo, prometheus ]
    ports:
      - "127.0.0.1:4317:4317" # OTLP gRPC
      - "127.0.0.1:4318:4318" # OTLP HTTP
    volumes:
      - ./config/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    command: [ "--config=/etc/otelcol/config.yaml" ]
    environment:
      OTLP_AUTH_TOKEN: ${OTLP_AUTH_TOKEN:-local-dev-token}
    logging: *default-logging
    platform: linux/amd64

  loki:
    image: grafana/loki:3.7.3
    restart: unless-stopped
    volumes:
      - ./config/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    command: [ "-config.file=/etc/loki/loki.yaml" ]
    logging: *default-logging

  tempo:
    # Held at 2.x: Tempo 3.0 is a re-architecture (ingester/compactor removed,
    # metrics-generator changed) needing a real config migration — see
    # https://grafana.com/docs/tempo/latest/set-up-for-tracing/setup-tempo/migrate-to-3/
    # Dependabot ignores 3.x majors until that migration is done deliberately.
    image: grafana/tempo:2.10.4
    restart: unless-stopped
    volumes:
      - ./config/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    command: [ "-config.file=/etc/tempo/tempo.yaml" ]
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.13.0
    restart: unless-stopped
    volumes:
      - ./config/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./config/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-remote-write-receiver
      # Prometheus 3.x: OTLP ingestion is its own flag, no longer a feature flag.
      - --web.enable-otlp-receiver
      - --enable-feature=native-histograms,exemplar-storage
      # Whichever hits first wins; the disk-space alert is the backstop.
      - --storage.tsdb.retention.size=15GB
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:v0.33.0
    restart: unless-stopped
    volumes:
      - ./config/alertmanager.yaml:/etc/alertmanager/alertmanager.yaml:ro
      - alertmanager_data:/alertmanager
    environment:
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      HEARTBEAT_URL: ${HEARTBEAT_URL:-}
    # Alertmanager can't expand env vars in its config; write the webhook
    # URLs to the url_file paths the config points at, then start.
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        printf '%s' "$$ALERT_WEBHOOK_URL" > /alertmanager/webhook_url
        printf '%s' "$$HEARTBEAT_URL" > /alertmanager/heartbeat_url
        exec /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yaml --storage.path=/alertmanager
    logging: *default-logging

  node-exporter:
    image: prom/node-exporter:v1.11.1
    restart: unless-stopped
    command: [ "--path.rootfs=/host" ]
    pid: host
    volumes:
      # No rslave: unsupported on Docker Desktop; only affects mounts added after start.
      - /:/host:ro
    logging: *default-logging

  grafana:
    image: grafana/grafana:13.1.0
    restart: unless-stopped
    depends_on: [ loki, tempo, prometheus ]
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./config/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./config/grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor,metricsSummary,traceToProfiles
    logging: *default-logging

volumes:
  loki_data:
  tempo_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:
