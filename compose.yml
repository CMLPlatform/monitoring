name: monitoring

# Central observability stack.
#   OTel Collector  →  ingestion gateway (OTLP gRPC 4317 / HTTP 4318)
#   Loki            →  logs
#   Tempo           →  traces  (OTLP-native; Grafana has first-class support)
#   Prometheus      →  metrics (native OTLP remote-write-receiver)
#   Grafana         →  UI
#
# Projects ship telemetry to this host via OTLP. Do NOT publish :4317/:4318
# directly to the public internet. Expose them via Cloudflare Tunnel, Tailscale,
# WireGuard, or similar. The ports below bind to 127.0.0.1, so only the host and
# the tunnel sidecar reach them.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-security: &default-security
  - no-new-privileges:true

# Every service also drops all capabilities and carries a pids limit: they all
# run unprivileged uids, write only to named volumes, and need none. The client
# templates go further, with read-only roots (templates/compose.telemetry.yml).

# Each mem_limit is sized from observed steady-state usage with headroom for
# bursts. They are ceilings, not reservations: they stop one runaway component
# from OOMing a host that also runs production.

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.156.0@sha256:125bdbeb7590cc1952c5b3430ecf14063568980c2c93d5b38676cc0446ed8108
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_started
      tempo:
        condition: service_started
      prometheus:
        condition: service_healthy
    ports:
      - "127.0.0.1:4317:4317" # OTLP gRPC
      - "127.0.0.1:4318:4318" # OTLP HTTP
    volumes:
      - ./config/otel-collector.yaml:/etc/otelcol/config.yaml:ro
      # File-backed exporter queue: telemetry buffered during a backend outage
      # survives a collector restart. The volume must be owned by uid 10001;
      # `just up` chowns it.
      - otel_queue:/var/lib/otelcol/queue
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      OTLP_AUTH_TOKEN: ${OTLP_AUTH_TOKEN:?set OTLP_AUTH_TOKEN in .env}
      DEPARTMENT: ${DEPARTMENT:-cml}
    # Keep in step with memory_limiter in config/otel-collector.yaml.
    mem_limit: 512m
    pids_limit: 512
    cap_drop: [ALL]
    security_opt: *default-security
    networks: [default, backend]
    logging: *default-logging

  loki:
    image: grafana/loki:3.7.6@sha256:efd47c67f9bac88ca29bcf8cb997d9ab29d1848bd0aff579282295542a745952
    restart: unless-stopped
    volumes:
      - ./config/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    command: ["-config.file=/etc/loki/loki.yaml"]
    # No healthcheck: the image is distroless, so there is no shell, wget or
    # curl to probe /ready with. Grafana's Stack Health dashboard covers it.
    mem_limit: 2g
    pids_limit: 1024
    cap_drop: [ALL]
    security_opt: *default-security
    networks: [backend]
    logging: *default-logging

  tempo:
    image: grafana/tempo:3.0.3@sha256:0296560ac66f8a3600d7fb3014a52c189d4d9c3549ad6ff441bf2409855d68d5
    restart: unless-stopped
    volumes:
      - ./config/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    # Distroless too, so no healthcheck (see loki).
    mem_limit: 2g
    pids_limit: 1024
    cap_drop: [ALL]
    security_opt: *default-security
    networks: [backend]
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.13.2@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
    restart: unless-stopped
    volumes:
      - ./config/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      # Prometheus 3.x: OTLP ingestion is its own flag, not an --enable-feature entry.
      - --web.enable-otlp-receiver
      - --enable-feature=native-histograms,exemplar-storage
      # Whichever hits first wins; the disk-space alert is the backstop.
      - --storage.tsdb.retention.size=15GB
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s
      # Probe often while starting: `--wait` (just up/smoke) returns on the
      # first pass, and both are ready well inside one 15s interval.
      start_interval: 2s
    mem_limit: 2g
    pids_limit: 1024
    cap_drop: [ALL]
    security_opt: *default-security
    networks: [backend]
    logging: *default-logging

  node-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    restart: unless-stopped
    command: ["--path.rootfs=/host"]
    pid: host
    mem_limit: 128m
    # Holds pid:host plus the whole host filesystem, so a compromise here sees
    # more than in any other service: hence the tightest limits of the set.
    cap_drop: [ALL]
    read_only: true
    pids_limit: 64
    security_opt: *default-security
    volumes:
      # No rslave: unsupported on Docker Desktop; only affects mounts added after start.
      # No network_mode:host either, so node_network_* describes the container
      # veth, not host NICs. Fine while nothing alerts on network metrics.
      - /:/host:ro
    networks: [backend]
    logging: *default-logging

  grafana:
    image: grafana/grafana:13.1.4@sha256:9be3a3ccdb06bcbb127f888b0c4c1d151837443e478887897a63a27d7b348043
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_started
      tempo:
        condition: service_started
      prometheus:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./config/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./config/grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./config/grafana/alerting:/etc/grafana/provisioning/alerting:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      # Expanded by Grafana into the provisioned contact points.
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      HEARTBEAT_URL: ${HEARTBEAT_URL:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      # Land on Stack Health instead of the empty welcome page.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/stack-health.json
      # Opt-in: secure cookies would break plain-http localhost logins. With
      # the tunnel overlay active, `just up` refuses to expose Grafana without
      # it.
      GF_SECURITY_COOKIE_SECURE: ${GRAFANA_COOKIE_SECURE:-false}
      GF_SECURITY_COOKIE_SAMESITE: strict
      # Opt-in per-user identity from Cloudflare Access, replacing the shared
      # admin login. Off until GRAFANA_JWT_AUTH=true plus CF_ACCESS_TEAM_DOMAIN
      # and CF_ACCESS_AUD are set in .env (the exposure guards enforce the
      # pair). New users land on the org's default role (Viewer).
      # No fallback domain: an unset team name must fail closed, not fetch
      # signing keys from a claimable cloudflareaccess.com subdomain.
      # The aud pin matters because the JWK set is team-wide. Without it, a
      # token minted for any other Access app in the team is accepted here
      # too.
      GF_AUTH_JWT_ENABLED: ${GRAFANA_JWT_AUTH:-false}
      GF_AUTH_JWT_HEADER_NAME: Cf-Access-Jwt-Assertion
      GF_AUTH_JWT_JWK_SET_URL: https://${CF_ACCESS_TEAM_DOMAIN:-}.cloudflareaccess.com/cdn-cgi/access/certs
      GF_AUTH_JWT_EXPECT_CLAIMS: '{"aud":"${CF_ACCESS_AUD:-}"}'
      GF_AUTH_JWT_EMAIL_CLAIM: email
      GF_AUTH_JWT_USERNAME_CLAIM: email
      GF_AUTH_JWT_AUTO_SIGN_UP: "true"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s
      # Probe often while starting: `--wait` (just up/smoke) returns on the
      # first pass, and both are ready well inside one 15s interval.
      start_interval: 2s
    mem_limit: 1g
    pids_limit: 1024
    cap_drop: [ALL]
    security_opt: *default-security
    networks: [default, backend]
    logging: *default-logging

# Loki, Prometheus and Tempo have no authentication of their own, so they live
# on a network with no gateway that only Grafana and the collector can reach.
# cloudflared (compose.tunnel.yml) stays on `default`: its ingress list is
# fetched from Cloudflare at runtime, so an edited ingress cannot publish a
# backend that skips the collector's token gate.
networks:
  backend:
    internal: true

volumes:
  loki_data:
  tempo_data:
  prometheus_data:
  grafana_data:
  # Not in `just backup`: queue contents are seconds of in-flight telemetry,
  # worthless by restore time.
  otel_queue:
